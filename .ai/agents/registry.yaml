schema_version: 1.0.0
registry_id: REG-SPECIALIST-PROFILE-001
title: Specialist Agent Profile Registry
lifecycle_status: UNDER_REVIEW
authority_basis: ADR-0005
additional_authority_basis:
- ADR-0006
runtime_enforcement_status: NOT_IMPLEMENTED
default_dispatch_status: NOT_DISPATCHABLE_WITHOUT_REGISTERED_ASSIGNMENT_AND_APPROVED_ROUTE
rules:
- profile-does-not-grant-authority
- canonical-role-and-assignment-must-be-registered
- profile-scope-must-be-narrower-than-role-and-assignment
- hidden-delegation-is-prohibited
- specialist-profile-may-not-spawn
- independent-review-requirements-remain-active
