schema_version: 1.0.0
registry_id: REG-GITHUB-CREDENTIAL-001
title: GitHub Credential Profile Registry
lifecycle_status: APPROVED
runtime_enforcement_status: NOT_IMPLEMENTED
authority_basis:
- ADR-0006
default_policy: DENY_UNLESS_EXACT_PROFILE_APPROVED
secret_values_in_registry: PROHIBITED
approved_profile_ids: []
profiles: []
required_profile_fields:
- credential_profile_id
- credential_kind
- owner
- organization_allowlist
- repository_allowlist
- permission_manifest
- issue_or_decision_ref
- created_at
- expires_at
- rotation_or_revocation_procedure_ref
- approval_status
rules:
- use-github-app-or-fine-grained-credential-where-practical
- resolve-exact-permissions-before-use
- do-not-log-display-export-or-commit-secret-values
- operation-scope-may-not-exceed-assignment-and-gate
- expired-suspended-unknown-or-drifted-profile-fails-closed
- revoke-on-role-suspension-or-security-incident
