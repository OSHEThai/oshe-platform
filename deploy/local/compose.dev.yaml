name: oshe-local

# Synthetic-only local development profile. No production credentials or customer data.
# Authority model (per ADR-0006):
#   - PostgreSQL is the AUTHORITATIVE transactional store and audit source.
#   - Meilisearch holds REBUILDABLE search projections only (one index per enabled locale).
#   - Valkey is a REBUILDABLE, non-authoritative cache/rate-limit/coordination store.
#   - SeaweedFS is an S3-compatible object store reached only through the S3 boundary.
#   - NATS JetStream is messaging used only AFTER the transactional outbox.
# All image references are digest-pinned (no mutable tags).

services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oshe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-oshe_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oshe_dev_synthetic_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oshe_dev} -d ${POSTGRES_DB:-oshe_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgis:
    image: postgis/postgis:17-3.6-alpine@sha256:a8ffa9afeea4ad6eada171fa2afdb57cd3eb90f92ce20156aa2cb8411d70e0cd
    profiles: ["postgis"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oshe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-oshe_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oshe_dev_synthetic_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oshe_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgisdata:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.51.0@sha256:a9eb29ee09ab4943db3b4c68620bd6f3382e6b2b0ac4431c0e607b48dbcd4c14
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-oshe_dev_synthetic_only}
      MEILI_ENV: development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - meilidata:/meili_data

  valkey:
    image: valkey/valkey:9.1.1-alpine@sha256:15568b9cb7eb67f4aed4de018c23f13d344e0e6437b31fe8fb8823dc81ebb3a9
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
    command: server -s3 -dir=/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - weeddata:/data

  nats:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    command: -js -m 8222
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgisdata:
  meilidata:
  weeddata:
