name: foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_mode:
        description: Incremental for ordinary work; Full only for Milestone closure
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
      milestone_close:
        description: Required Milestone title when ci_mode is full
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: foundation / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r .ai/requirements-validation.txt
      - name: Run non-fail-fast CI batch
        env:
          REQUESTED_CI_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_mode || 'incremental' }}
          MILESTONE_CLOSE: ${{ github.event_name == 'workflow_dispatch' && inputs.milestone_close || '' }}
        run: |
          if [ "$REQUESTED_CI_MODE" = "full" ]; then
            python tools/run_local_ci.py --mode full --milestone-close "$MILESTONE_CLOSE" --no-checkpoint
          else
            python tools/run_local_ci.py --mode incremental --no-checkpoint
          fi
