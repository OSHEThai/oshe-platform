name: Bug report
description: Report a reproducible defect.
title: "[Bug]: "
labels: ["type:bug", "state:triage"]
body:
  - type: markdown
    attributes:
      value: Do not submit security vulnerabilities or restricted customer data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment profile
      options:
        - Development
        - SaaS
        - Self-hosted
        - Site edge
        - Hybrid
        - Air-gapped
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Suspected impact
      options:
        - Low
        - Medium
        - High
        - Critical
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and data check
      options:
        - label: I removed secrets and restricted data.
          required: true
        - label: This is not a public security-vulnerability report.
          required: true
